[[custom_groups]]
name = "🎯 全球直连"
type = "select"
rule = [
  "[]DIRECT",
  "http://wifi.vivo.com.cn/generate_204",
]

[[custom_groups]]
name = "🎯 全球拦截"
type = "select"
rule = [
  "[]REJECT",
]

[[custom_groups]]
name = "🇺🇸 自动美国节点"
type = "url-test"
rule = ['(🇺🇸|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|纽约|纽纽|亚特兰大|迈阿密|华盛顿|\bUS(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|United States|UnitedStates|UNITED STATES|USA|America|AMERICA|JFK|EWR|IAD|ATL|ORD|MIA|NYC|LAX|SFO|SEA|DFW|SJC)']
url = "https://cp.cloudflare.com/generate_204"
interval = 300
timeout = 0
tolerance = 50

[[custom_groups]]
name = "🇭🇰 自动香港节点"
type = "url-test"
rule = ['(🇭🇰|港|\bHK(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|hk|Hong Kong|HongKong|hongkong|HONG KONG|HONGKONG|深港|HKG|九龙|Kowloon|新界|沙田|荃湾|葵涌)']
url = "https://cp.cloudflare.com/generate_204"
interval = 300
timeout = 0
tolerance = 50

[[custom_groups]]
name = "🇼🇸 自动台湾节点"
type = "url-test"
rule = ['(🇹🇼|🇼🇸|台|新北|彰化|\bTW(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|Taiwan|TAIWAN|TWN|TPE|ROC)']
url = "https://cp.cloudflare.com/generate_204"
interval = 300
timeout = 0
tolerance = 50

[[custom_groups]]
name = "🇸🇬 自动新加坡节点"
type = "url-test"
rule = ['(🇸🇬|新加坡|坡|狮城|\bSG(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|Singapore|SINGAPORE|SIN)']
url = "https://cp.cloudflare.com/generate_204"
interval = 300
timeout = 0
tolerance = 50

[[custom_groups]]
name = "🇯🇵 自动日本节点"
type = "url-test"
rule = ['(🇯🇵|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|(?<!尼|-)日|\bJP(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|Japan|JAPAN|JPN|NRT|HND|KIX|TYO|OSA|关西|Kansai|KANSAI)']
