interval = 300
timeout = 0
tolerance = 50

[[custom_groups]]
name = "🇰🇷 自动韩国节点"
type = "url-test"
rule = ['(🇰🇷|\bKR(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|Korea|KOREA|KOR|首尔|韩|韓|春川|Chuncheon|ICN)']
