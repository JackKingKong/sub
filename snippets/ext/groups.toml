rule = ['(🇸🇬|新加坡|坡|狮城|\bSG(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|Singapore|SINGAPORE|SIN)']
url = "https://cp.cloudflare.com/generate_204"
interval = 300
timeout = 0
tolerance = 50

[[custom_groups]]
