  "[]🇼🇸 自动台湾节点",
  "[]🇸🇬 自动新加坡节点",
  "[]🇯🇵 自动日本节点",
  "[]🇰🇷 自动韩国节点",
  "[]🇺🇸 自动美国节点",
  "[]🇬🇧 自动英国节点",
  "[]🇳🇱 自动荷兰节点",
  "[]🇳🇿 自动新西兰节点",
